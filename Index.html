<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Trading RPG</title>
<style>
:root{
  --bg:#08111f;--card:#111d30;--card2:#17263d;--text:#f8fafc;--muted:#94a3b8;
  --line:#2a3a56;--green:#34d399;--blue:#60a5fa;--red:#fb7185;--yellow:#fbbf24
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% -10%,#17345a 0,transparent 32%),var(--bg)}
main{width:min(760px,100%);margin:auto;padding:12px 12px 98px}
.card{background:rgba(17,29,48,.97);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:17px;margin-bottom:12px;box-shadow:0 14px 42px rgba(0,0,0,.22)}
h1{font-size:24px;margin:4px 0 10px}h2{font-size:17px;margin:0 0 10px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--green)}
.muted{color:var(--muted);font-size:12px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.metric{background:var(--card2);padding:12px;border-radius:14px}.label{color:var(--muted);font-size:12px}.value{font-size:23px;font-weight:900;margin-top:3px}.green{color:var(--green)}.yellow{color:var(--yellow)}
input,button{font:inherit}input{width:100%;background:#091426;border:1px solid var(--line);border-radius:14px;padding:14px;color:#fff;outline:0}input:focus{border-color:var(--blue)}
.field{margin-top:9px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin:0 0 6px}
button{border:0;border-radius:14px;padding:14px 15px;font-weight:900;cursor:pointer}.full{width:100%}.primary{background:var(--green);color:#03130f;font-size:17px}.ghost{background:transparent;border:1px solid var(--line);color:#fff}.danger{background:var(--red);color:#fff}.secondary{background:#93c5fd;color:#07111f}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.progress{height:12px;background:#07101d;border-radius:99px;overflow:hidden;margin:10px 0}.bar{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));width:0;transition:.25s}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat,.entry,.achievement{background:var(--card2);padding:11px;border-radius:12px;margin-top:7px}.stat{text-align:center}.stat b{display:block;font-size:18px;margin-top:2px}
.entryTop{display:flex;justify-content:space-between;gap:10px}.win{color:var(--green)}.loss{color:var(--red)}
.quote{font-size:18px;font-weight:900;line-height:1.4}
.levelbox{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:linear-gradient(145deg,rgba(96,165,250,.08),rgba(52,211,153,.06));border:1px solid rgba(96,165,250,.18);padding:14px;border-radius:16px}.levelnum{font-size:30px;font-weight:1000;color:var(--yellow)}
.expTrack{height:10px;background:#08111f;border-radius:999px;overflow:hidden;margin-top:7px}.expBar{height:100%;background:linear-gradient(90deg,var(--yellow),var(--green));width:0}
.tabPage{display:none}.tabPage.active{display:block}
.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);z-index:50;background:rgba(8,17,31,.96);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.07);padding:8px 8px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.navBtn{background:transparent;color:var(--muted);padding:9px 2px;border-radius:12px;font-size:11px;font-weight:800}.navBtn span{display:block;font-size:20px;line-height:1.1;margin-bottom:3px}.navBtn.active{background:var(--card2);color:#fff}
.notice{text-align:center;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);padding:15px;border-radius:14px}
svg{width:100%;height:190px;display:block}.chartWrap{background:#0b1628;border-radius:14px;padding:10px}
.achievements{display:grid;grid-template-columns:1fr 1fr;gap:8px}.achievement{margin-top:0}.achievement.locked{opacity:.4;filter:grayscale(.6)}.achIcon{font-size:25px}.achTitle{font-weight:900;margin-top:3px}.achDesc{color:var(--muted);font-size:11px;margin-top:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}.modalBox{width:min(520px,100%);max-height:92vh;overflow:auto;background:#0f1b2d;border:1px solid var(--line);border-radius:22px;padding:20px}.hidden{display:none!important}
.hint{background:#0b1628;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;color:#cbd5e1;font-size:12px}
@media(max-width:520px){.value{font-size:20px}.row{grid-template-columns:1fr}.achievements{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>

<section id="tab-home" class="tabPage active">
  <section class="card">
    <div class="eyebrow">TODAY'S MINDSET</div>
    <div class="quote" id="mindset">1%면 충분하다.</div>
  </section>

  <section class="card">
    <div class="eyebrow">TRADING RPG</div>
    <h1>오늘 거래</h1>
    <div class="summary">
      <div class="metric"><div class="label">총자산</div><div class="value" id="homeTotal">$0.00</div></div>
      <div class="metric"><div class="label">운용금</div><div class="value green" id="homeFund">$0.00</div></div>
    </div>

    <div id="tradeForm">
      <div class="field"><label>종료 운용금 ($)</label><input id="endFund" type="number" min="0" step="0.01" inputmode="decimal" placeholder="종료 운용금 입력"></div>
      <div class="field"><label>한 줄 메모 (선택)</label><input id="note" type="text" placeholder="예: 찌르고 복귀 후 롱"></div>
      <button id="saveTrade" class="primary full" style="margin-top:10px">거래 저장</button>
      <div class="row"><button id="skipTrade" class="ghost">오늘 쉼</button><button id="liquidation" class="danger">청산</button></div>
    </div>

    <div id="doneNotice" class="notice hidden">
      <b class="green">✅ 오늘 기록 완료</b>
      <div class="muted" style="margin-top:4px">내일 다시 오면 된다.</div>
      <button id="editToday" class="ghost full" style="margin-top:10px">오늘 기록 수정</button>
    </div>
  </section>

  <section class="card">
    <div class="levelbox">
      <div class="levelnum" id="levelNum">Lv.1</div>
      <div>
        <b id="levelTitle">Rookie Trader</b>
        <div class="muted" id="expText">EXP 0 / 100</div>
        <div class="expTrack"><div class="expBar" id="expBar"></div></div>
      </div>
    </div>
  </section>
</section>

<section id="tab-stats" class="tabPage">
  <section class="card">
    <h2>목표 진행</h2>
    <div class="progress"><div class="bar" id="goalBar"></div></div>
    <div class="muted" id="goalText"></div>
  </section>
  <section class="card">
    <h2>자산 성장</h2>
    <div class="chartWrap"><svg id="assetChart" viewBox="0 0 640 190" preserveAspectRatio="none"></svg></div>
    <div class="muted" id="chartCaption" style="margin-top:8px"></div>
  </section>
  <section class="card">
    <h2>통계</h2>
    <div class="stats">
      <div class="stat"><span class="muted">거래일</span><b id="tradeDays">0</b></div>
      <div class="stat"><span class="muted">승률</span><b id="winRate">0%</b></div>
      <div class="stat"><span class="muted">현재 연승</span><b id="streak">0</b></div>
      <div class="stat"><span class="muted">최고자산</span><b id="peak">$0</b></div>
      <div class="stat"><span class="muted">최대낙폭</span><b id="mdd">0%</b></div>
      <div class="stat"><span class="muted">티어</span><b id="tier">-</b></div>
    </div>
  </section>
</section>

<section id="tab-journal" class="tabPage">
  <section class="card">
    <h2>매매 일지</h2>
    <div id="history"></div>
  </section>
</section>

<section id="tab-achievements" class="tabPage">
  <section class="card">
    <h2>업적</h2>
    <div class="achievements" id="achievements"></div>
  </section>
</section>

<section id="tab-settings" class="tabPage">
  <section class="card">
    <h2>설정</h2>
    <div class="field"><label>시작 총자산 기준 ($)</label><input id="setInitial" type="number" step="0.01"></div>
    <div class="field"><label>현재 총자산 ($)</label><input id="setTotal" type="number" step="0.01"></div>
    <div class="field"><label>현재 복리 운용금 ($)</label><input id="setFund" type="number" step="0.01"></div>
    <div class="field"><label>청산 후 재시작 운용 비율 (%)</label><input id="setRatio" type="number" min="0.1" max="100" step="0.1"></div>
    <div class="field"><label>목표 자산 ($)</label><input id="setGoal" type="number" min="1" step="1"></div>
    <button id="saveSettings" class="primary full" style="margin-top:12px">설정 저장</button>
  </section>
  <section class="card">
    <h2>데이터</h2>
    <div class="row"><button id="exportData" class="ghost">백업</button><button id="importData" class="ghost">복원</button></div>
    <input id="importFile" type="file" accept=".json" style="display:none">
    <button id="resetAll" class="danger full" style="margin-top:10px">전체 초기화</button>
  </section>
</section>

</main>

<nav class="bottomNav">
  <button class="navBtn active" data-tab="home"><span>🏠</span>홈</button>
  <button class="navBtn" data-tab="stats"><span>📈</span>통계</button>
  <button class="navBtn" data-tab="journal"><span>📖</span>일지</button>
  <button class="navBtn" data-tab="achievements"><span>🏆</span>업적</button>
  <button class="navBtn" data-tab="settings"><span>⚙️</span>설정</button>
</nav>

<div id="setupModal" class="modal hidden">
  <div class="modalBox">
    <div class="eyebrow">FIRST SETUP</div>
    <h1>시작 설정</h1>
    <div class="muted">실제 시작 자산을 넣으면 그래프도 그 금액부터 시작해.</div>
    <div class="field"><label>시작 총자산 ($)</label><input id="setupAsset" type="number" min="0.01" step="0.01" placeholder="예: 127"></div>
    <div class="field"><label>운용 비율 (%)</label><input id="setupRatio" type="number" min="0.1" max="100" step="0.1" value="20"></div>
    <div class="field"><label>시작 운용금 ($)</label><input id="setupFund" type="number" min="0" step="0.01"></div>
    <div class="field"><label>목표 자산 ($)</label><input id="setupGoal" type="number" min="1" step="1" value="10000"></div>
    <div class="hint">총자산을 입력하면 운용 비율 기준으로 운용금이 자동 계산돼.</div>
    <button id="startApp" class="primary full" style="margin-top:14px">시작하기</button>
  </div>
</div>

<script>
(function(){
"use strict";
const KEY="trading_rpg_compound_v5";
const $=id=>document.getElementById(id);
const today=()=>new Date().toLocaleDateString("sv-SE");
const money=n=>"$"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const mindsets=[
 "1%면 충분하다.","기회는 매일 온다.","놓친 자리는 내 자리가 아니다.","하루 한 번이면 충분하다.",
 "찌르고 복귀할 때까지 기다린다.","욕심보다 규칙.","확신 없으면 쉰다.","롱을 우선으로 본다."
];

function fresh(){return{configured:false,initialAsset:0,totalAsset:0,activeFund:0,ratio:20,goal:10000,records:[]}}
function normalize(s){
 if(!s||typeof s!=="object") return fresh();
 return{
  configured:!!s.configured || Number(s.initialAsset)>0,
  initialAsset:Number(s.initialAsset??s.initial??0),
  totalAsset:Number(s.totalAsset??s.currentAsset??s.current??0),
  activeFund:Number(s.activeFund??0),
  ratio:Number(s.ratio??20),
  goal:Number(s.goal??10000),
  records:Array.isArray(s.records)?s.records:[]
 };
}
let state=(()=>{try{const raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw))}catch(e){}return fresh()})();
const persist=()=>localStorage.setItem(KEY,JSON.stringify(state));
const todayRecord=()=>state.records.find(r=>r.date===today());

function dailyMindset(){
 const d=new Date(); const seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
 return mindsets[seed%mindsets.length];
}
function tier(a){
 const r=state.goal? a/state.goal:0;
 if(r>=1)return"챌린저"; if(r>=.5)return"마스터"; if(r>=.1)return"다이아"; if(r>=.05)return"플래티넘"; if(r>=.01)return"골드"; if(r>=.0025)return"실버"; return"브론즈";
}
function tradeStats(){
 const trades=state.records.filter(r=>r.type==="trade"||r.type==="liquidation");
 const wins=trades.filter(r=>r.endFund>r.startFund).length;
 let streak=0;for(let i=trades.length-1;i>=0;i--){if(trades[i].endFund>trades[i].startFund)streak++;else break}
 let peak=state.initialAsset||0,mdd=0;
 [state.initialAsset,...state.records.map(r=>Number(r.totalAfter))].filter(Number.isFinite).forEach(a=>{peak=Math.max(peak,a);if(peak>0)mdd=Math.max(mdd,(peak-a)/peak*100)});
 return{trades,wins,days:trades.length,winRate:trades.length?wins/trades.length*100:0,streak,peak,mdd};
}
function levelData(){
 const completed=state.records.length;
 const wins=state.records.filter(r=>r.type==="trade"&&r.endFund>r.startFund).length;
 const exp=completed*20+wins*10;
 const level=Math.floor(exp/100)+1;
 return{level,expInto:exp%100,totalExp:exp};
}
function levelTitle(lv){
 if(lv>=30)return"Legend Trader"; if(lv>=20)return"Master Trader"; if(lv>=10)return"Pro Trader"; if(lv>=5)return"Skilled Trader"; return"Rookie Trader";
}
function drawChart(){
 const svg=$("assetChart");svg.innerHTML="";
 const vals=[state.initialAsset,...state.records.map(r=>Number(r.totalAfter))].filter(Number.isFinite);
 if(!vals.length)return;
 const W=640,H=190,pad=18,min=Math.min(...vals),max=Math.max(...vals),range=Math.max(max-min,1);
 const pts=vals.map((v,i)=>[pad+(W-pad*2)*(vals.length===1?.5:i/(vals.length-1)),H-pad-(H-pad*2)*(v-min)/range]);
 const ns="http://www.w3.org/2000/svg";
 const line=document.createElementNS(ns,"polyline");line.setAttribute("fill","none");line.setAttribute("stroke","#34d399");line.setAttribute("stroke-width","4");line.setAttribute("stroke-linecap","round");line.setAttribute("stroke-linejoin","round");line.setAttribute("points",pts.map(p=>p.join(",")).join(" "));svg.appendChild(line);
 pts.forEach((p,i)=>{const c=document.createElementNS(ns,"circle");c.setAttribute("cx",p[0]);c.setAttribute("cy",p[1]);c.setAttribute("r",i===pts.length-1?"5":"3");c.setAttribute("fill",i===pts.length-1?"#60a5fa":"#34d399");svg.appendChild(c)});
 $("chartCaption").textContent=`시작 ${money(state.initialAsset)} → 현재 ${money(state.totalAsset)}`;
}
function renderAchievements(){
 const st=tradeStats(); const total=state.totalAsset; const count=state.records.length;
 const list=[
  ["🎬","첫 기록","첫 일지를 남겼다",count>=1],
  ["✅","첫 승","첫 수익 거래 성공",st.wins>=1],
  ["🔥","5연승","5번 연속 수익 거래",st.streak>=5],
  ["⚡","10연승","10번 연속 수익 거래",st.streak>=10],
  ["📅","30일 기록","30일치 기록 달성",count>=30],
  ["💰","$100","총자산 $100 달성",total>=100],
  ["💎","$1,000","총자산 $1,000 달성",total>=1000],
  ["🚀","최종 목표","목표 자산 달성",total>=state.goal]
 ];
 $("achievements").innerHTML="";
 list.forEach(a=>{const e=document.createElement("div");e.className="achievement"+(a[3]?"":" locked");e.innerHTML=`<div class="achIcon">${a[0]}</div><div class="achTitle">${a[1]}</div><div class="achDesc">${a[2]}</div>`;$("achievements").appendChild(e)});
}
function renderHistory(){
 const h=$("history");h.innerHTML="";const rows=[...state.records].reverse();
 if(!rows.length){h.innerHTML='<div class="muted">아직 기록 없음</div>';return}
 rows.forEach(r=>{
  const c=r.startFund?((r.endFund/r.startFund)-1)*100:0;
  const e=document.createElement("div");e.className="entry";
  const label=r.type==="skip"?"쉼":r.type==="liquidation"?"청산":(c>=0?"+":"")+c.toFixed(1)+"%";
  e.innerHTML=`<div class="entryTop"><b>${r.date}</b><b class="${r.type==="liquidation"||c<0?"loss":"win"}">${label}</b></div><div class="muted">${r.type==="skip"?"거래 없음":money(r.startFund)+" → "+money(r.endFund)+" · 총자산 "+money(r.totalAfter)}${r.note?" · "+escapeHtml(r.note):""}</div>`;
  h.appendChild(e);
 });
}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function populateSettings(){
 $("setInitial").value=state.initialAsset;$("setTotal").value=state.totalAsset;$("setFund").value=state.activeFund;$("setRatio").value=state.ratio;$("setGoal").value=state.goal;
}
function render(){
 if(!state.configured){$("setupModal").classList.remove("hidden");return}
 $("setupModal").classList.add("hidden");
 $("mindset").textContent=dailyMindset();
 $("homeTotal").textContent=money(state.totalAsset);$("homeFund").textContent=money(state.activeFund);
 const done=!!todayRecord();$("tradeForm").classList.toggle("hidden",done);$("doneNotice").classList.toggle("hidden",!done);
 const p=Math.min(100,state.goal?state.totalAsset/state.goal*100:0);$("goalBar").style.width=p+"%";$("goalText").textContent=`${money(state.totalAsset)} / ${money(state.goal)} · ${p.toFixed(3)}%`;
 const s=tradeStats();$("tradeDays").textContent=s.days;$("winRate").textContent=s.winRate.toFixed(1)+"%";$("streak").textContent=s.streak;$("peak").textContent=money(s.peak);$("mdd").textContent=s.mdd.toFixed(1)+"%";$("tier").textContent=tier(state.totalAsset);
 const lv=levelData();$("levelNum").textContent="Lv."+lv.level;$("levelTitle").textContent=levelTitle(lv.level);$("expText").textContent=`EXP ${lv.expInto} / 100`;$("expBar").style.width=lv.expInto+"%";
 drawChart();renderHistory();renderAchievements();populateSettings();
}
$("setupAsset").oninput=()=>{const a=Number($("setupAsset").value),r=Number($("setupRatio").value);if(Number.isFinite(a)&&Number.isFinite(r))$("setupFund").value=(a*r/100).toFixed(2)};
$("setupRatio").oninput=$("setupAsset").oninput;
$("startApp").onclick=()=>{
 const a=Number($("setupAsset").value),r=Number($("setupRatio").value),f=Number($("setupFund").value),g=Number($("setupGoal").value);
 if(!Number.isFinite(a)||a<=0)return alert("시작 총자산을 입력해줘.");
 if(!Number.isFinite(r)||r<=0||r>100)return alert("운용 비율을 확인해줘.");
 if(!Number.isFinite(f)||f<0||f>a)return alert("시작 운용금을 확인해줘.");
 if(!Number.isFinite(g)||g<=0)return alert("목표 금액을 확인해줘.");
 state={configured:true,initialAsset:a,totalAsset:a,activeFund:f,ratio:r,goal:g,records:[]};persist();render();
};
$("saveTrade").onclick=()=>{
 const end=Number($("endFund").value);if(!Number.isFinite(end)||end<0)return alert("종료 운용금을 입력해줘.");
 const start=state.activeFund,before=state.totalAsset;state.totalAsset=Math.max(0,before+end-start);state.activeFund=end;
 state.records.push({date:today(),type:"trade",startFund:start,endFund:end,totalBefore:before,totalAfter:state.totalAsset,note:$("note").value.trim()});
 persist();$("endFund").value="";$("note").value="";render();
};
$("skipTrade").onclick=()=>{state.records.push({date:today(),type:"skip",startFund:state.activeFund,endFund:state.activeFund,totalBefore:state.totalAsset,totalAfter:state.totalAsset,note:$("note").value.trim()});persist();render()};
$("liquidation").onclick=()=>{if(!confirm("현재 운용금 전액 청산으로 기록할까?"))return;const start=state.activeFund,before=state.totalAsset;state.totalAsset=Math.max(0,before-start);state.activeFund=state.totalAsset*(state.ratio/100);state.records.push({date:today(),type:"liquidation",startFund:start,endFund:0,totalBefore:before,totalAfter:state.totalAsset,note:`청산 후 총자산의 ${state.ratio}%로 재시작`});persist();render()};
$("editToday").onclick=()=>{const i=state.records.findIndex(r=>r.date===today());if(i<0)return;const r=state.records[i];state.totalAsset=r.totalBefore;state.activeFund=r.startFund;state.records.splice(i,1);persist();render()};
$("saveSettings").onclick=()=>{
 const i=Number($("setInitial").value),t=Number($("setTotal").value),f=Number($("setFund").value),r=Number($("setRatio").value),g=Number($("setGoal").value);
 if(![i,t,f,r,g].every(Number.isFinite)||i<=0||t<0||f<0||f>t||r<=0||r>100||g<=0)return alert("입력값 확인");
 state.initialAsset=i;state.totalAsset=t;state.activeFund=f;state.ratio=r;state.goal=g;persist();render();alert("설정 저장 완료");
};
$("exportData").onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="trading-rpg-backup.json";a.click();URL.revokeObjectURL(a.href)};
$("importData").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{state=normalize(JSON.parse(await f.text()));persist();render();alert("복원 완료");}catch(err){alert("백업 파일 오류");}e.target.value=""};
$("resetAll").onclick=()=>{if(confirm("모든 데이터 삭제?")){localStorage.removeItem(KEY);state=fresh();render()}};
document.querySelectorAll(".navBtn").forEach(btn=>btn.onclick=()=>{
 document.querySelectorAll(".navBtn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
 document.querySelectorAll(".tabPage").forEach(p=>p.classList.remove("active"));$("tab-"+btn.dataset.tab).classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
});
render();
})();
</script>
</body>
</html>
