<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Trading RPG</title><style>
:root{--bg:#08111f;--card:#111d30;--card2:#17263d;--text:#f8fafc;--muted:#94a3b8;--line:#2a3a56;--green:#34d399;--blue:#60a5fa;--red:#fb7185;--yellow:#fbbf24}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 50% -10%,#17345a 0,transparent 32%),var(--bg)}main{max-width:760px;margin:auto;padding:12px 12px 102px}.card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:17px;margin-bottom:12px}h1{font-size:24px;margin:4px 0 10px}h2{font-size:17px;margin:0 0 10px}.eyebrow{font-size:12px;font-weight:900;color:var(--green);letter-spacing:.1em}.muted{color:var(--muted);font-size:12px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.metric{background:var(--card2);padding:12px;border-radius:14px}.label{color:var(--muted);font-size:12px}.value{font-size:23px;font-weight:900}.green{color:var(--green)}input,button{font:inherit}input{width:100%;background:#091426;border:1px solid var(--line);border-radius:14px;padding:14px;color:#fff}.field{margin-top:9px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:6px}button{border:0;border-radius:14px;padding:14px 15px;font-weight:900}.full{width:100%}.primary{background:var(--green);color:#03130f}.ghost{background:transparent;border:1px solid var(--line);color:#fff}.danger{background:var(--red);color:#fff}.secondary{background:#93c5fd;color:#07111f}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.progress{height:12px;background:#07101d;border-radius:99px;overflow:hidden;margin:10px 0}.bar{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));width:0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat,.entry,.achievement{background:var(--card2);padding:11px;border-radius:12px;margin-top:7px}.stat{text-align:center}.stat b{display:block;font-size:18px}.entryTop{display:flex;justify-content:space-between}.win{color:var(--green)}.loss{color:var(--red)}.quote{font-size:18px;font-weight:900}.levelbox{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--card2);padding:14px;border-radius:16px}.levelnum{font-size:30px;font-weight:1000;color:var(--yellow)}.expTrack{height:10px;background:#08111f;border-radius:999px;overflow:hidden;margin-top:7px}.expBar{height:100%;background:linear-gradient(90deg,var(--yellow),var(--green));width:0}.tabPage{display:none}.tabPage.active{display:block}.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);z-index:50;background:rgba(8,17,31,.96);border-top:1px solid rgba(255,255,255,.07);padding:8px 8px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.navBtn{background:transparent;color:var(--muted);padding:9px 2px;border-radius:12px;font-size:11px}.navBtn span{display:block;font-size:20px}.navBtn.active{background:var(--card2);color:#fff}.notice{text-align:center;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);padding:15px;border-radius:14px}.hidden{display:none!important}.achievements{display:grid;grid-template-columns:1fr 1fr;gap:8px}.achievement{margin-top:0}.achievement.locked{opacity:.4}.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:var(--muted);font-size:11px}.day{aspect-ratio:1;border-radius:10px;background:#0b1628;display:flex;align-items:center;justify-content:center;font-size:12px}.day.winDay{background:rgba(52,211,153,.16)}.day.lossDay{background:rgba(251,113,133,.16)}.day.skipDay{background:rgba(148,163,184,.12)}.day.today{outline:2px solid var(--blue)}.calendarHead{display:flex;justify-content:space-between;align-items:center}.chart{height:180px;background:#0b1628;border-radius:14px;position:relative;overflow:hidden}.chart svg{width:100%;height:100%}.monthRow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}#splash{position:fixed;inset:0;z-index:200;background:#08111f;display:flex;align-items:center;justify-content:center;transition:.35s}.splashIcon{width:96px;border-radius:24px}.splashTitle{font-size:28px;font-weight:1000;margin-top:12px}.splashSub{color:var(--muted);margin-top:4px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#122238;padding:10px 14px;border-radius:999px;opacity:0;transition:.25s;z-index:120}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:520px){.row{grid-template-columns:1fr}.value{font-size:20px}}
</style></head><body>
<div id="splash"><div style="text-align:center"><img src="icon-192.png" class="splashIcon"><div class="splashTitle">Trading RPG</div><div class="splashSub">Discipline &gt; Emotion</div></div></div><div id="toast" class="toast"></div>
<main>
<section id="tab-home" class="tabPage active"><section class="card"><div class="eyebrow">TODAY'S MINDSET</div><div class="quote" id="mindset">1%면 충분하다.</div></section><section class="card"><div class="eyebrow">TRADING RPG</div><h1>오늘 거래</h1><div class="summary"><div class="metric"><div class="label">총자산</div><div class="value" id="homeTotal">$0.00</div></div><div class="metric"><div class="label">운용금</div><div class="value green" id="homeFund">$0.00</div></div></div><div id="tradeForm"><div class="field"><label>종료 운용금 ($)</label><input id="endFund" type="number" step="0.01" placeholder="종료 운용금 입력"></div><div class="field"><label>한 줄 메모</label><input id="note" placeholder="찌르고 복귀 후 롱"></div><button id="saveTrade" class="primary full" style="margin-top:10px">거래 저장</button><div class="row"><button id="skipTrade" class="ghost">오늘 쉼</button><button id="liquidation" class="danger">청산</button></div></div><div id="doneNotice" class="notice hidden"><b class="green">✅ 오늘 기록 완료</b><button id="editToday" class="ghost full" style="margin-top:10px">오늘 기록 수정</button></div><button id="installBtn" class="secondary full hidden" style="margin-top:10px">📲 앱으로 설치</button></section><section class="card"><div class="levelbox"><div class="levelnum" id="levelNum">Lv.1</div><div><b id="levelTitle">Rookie Trader</b><div class="muted" id="expText">EXP 0 / 100</div><div class="expTrack"><div id="expBar" class="expBar"></div></div></div></div></section></section>
<section id="tab-stats" class="tabPage"><section class="card"><h2>목표 진행</h2><div class="progress"><div id="goalBar" class="bar"></div></div><div id="goalText" class="muted"></div></section><section class="card"><h2>자산 성장</h2><div class="chart"><svg id="assetChart" viewBox="0 0 640 180"></svg></div><div id="chartCaption" class="muted" style="margin-top:8px"></div></section><section class="card"><h2>통계</h2><div class="stats"><div class="stat"><span class="muted">거래일</span><b id="tradeDays">0</b></div><div class="stat"><span class="muted">승률</span><b id="winRate">0%</b></div><div class="stat"><span class="muted">현재 연승</span><b id="streak">0</b></div><div class="stat"><span class="muted">최고자산</span><b id="peak">$0</b></div><div class="stat"><span class="muted">최대낙폭</span><b id="mdd">0%</b></div><div class="stat"><span class="muted">티어</span><b id="tier">-</b></div></div></section><section class="card"><h2>월별 수익률</h2><div id="monthlyStats"></div></section></section>
<section id="tab-journal" class="tabPage"><section class="card"><div class="calendarHead"><button id="prevMonth" class="ghost">‹</button><h2 id="calendarTitle"></h2><button id="nextMonth" class="ghost">›</button></div><div id="calendar" class="calendarGrid"></div></section><section class="card"><h2>매매 일지</h2><div id="history"></div></section></section>
<section id="tab-achievements" class="tabPage"><section class="card"><h2>업적</h2><div id="achievements" class="achievements"></div></section></section>
<section id="tab-settings" class="tabPage"><section class="card"><h2>설정</h2><div class="field"><label>시작 총자산 ($)</label><input id="setInitial" type="number" step="0.01"></div><div class="field"><label>현재 총자산 ($)</label><input id="setTotal" type="number" step="0.01"></div><div class="field"><label>현재 복리 운용금 ($)</label><input id="setFund" type="number" step="0.01"></div><div class="field"><label>청산 후 재시작 비율 (%)</label><input id="setRatio" type="number" step="0.1"></div><div class="field"><label>목표 자산 ($)</label><input id="setGoal" type="number" step="1"></div><button id="saveSettings" class="primary full" style="margin-top:10px">설정 저장</button></section><section class="card"><h2>데이터</h2><div class="row"><button id="exportData" class="ghost">백업</button><button id="importData" class="ghost">복원</button></div><input id="importFile" type="file" accept=".json" style="display:none"><button id="resetAll" class="danger full" style="margin-top:10px">전체 초기화</button></section></section>
</main>
<nav class="bottomNav"><button class="navBtn active" data-tab="home"><span>🏠</span>홈</button><button class="navBtn" data-tab="stats"><span>📈</span>통계</button><button class="navBtn" data-tab="journal"><span>📖</span>일지</button><button class="navBtn" data-tab="achievements"><span>🏆</span>업적</button><button class="navBtn" data-tab="settings"><span>⚙️</span>설정</button></nav>
<div id="setupModal" class="hidden"></div>
<script>
const KEY="trading_rpg_compound_v5",money=n=>"$"+Number(n||0).toFixed(2),today=()=>new Date().toLocaleDateString("sv-SE"),$=id=>document.getElementById(id);
let state=(()=>{try{let s=JSON.parse(localStorage.getItem(KEY));if(s)return s}catch(e){}return{configured:true,initialAsset:10,totalAsset:10,activeFund:2,ratio:20,goal:10000,records:[]}})();
const save=()=>localStorage.setItem(KEY,JSON.stringify(state)),mind=["1%면 충분하다.","기회는 매일 온다.","놓친 자리는 내 자리가 아니다.","하루 한 번이면 충분하다.","찌르고 복귀할 때까지 기다린다.","욕심보다 규칙.","확신 없으면 쉰다.","롱을 우선으로 본다."];
let cal=new Date(),deferredPrompt=null;
function stats(){let t=state.records.filter(r=>r.type!=="skip"),w=t.filter(r=>r.endFund>r.startFund).length,s=0;for(let i=t.length-1;i>=0&&t[i].endFund>t[i].startFund;i--)s++;let peak=state.initialAsset,mdd=0;[state.initialAsset,...state.records.map(r=>r.totalAfter)].forEach(a=>{peak=Math.max(peak,a);if(peak)mdd=Math.max(mdd,(peak-a)/peak*100)});return{t,w,s,peak,mdd}}
function tier(){let r=state.totalAsset/state.goal;return r>=1?"챌린저":r>=.5?"마스터":r>=.1?"다이아":r>=.05?"플래티넘":r>=.01?"골드":r>=.0025?"실버":"브론즈"}
function render(){let d=new Date();$("mindset").textContent=mind[(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())%mind.length];$("homeTotal").textContent=money(state.totalAsset);$("homeFund").textContent=money(state.activeFund);let done=state.records.some(r=>r.date===today());$("tradeForm").classList.toggle("hidden",done);$("doneNotice").classList.toggle("hidden",!done);let p=Math.min(100,state.totalAsset/state.goal*100);$("goalBar").style.width=p+"%";$("goalText").textContent=`${money(state.totalAsset)} / ${money(state.goal)} · ${p.toFixed(3)}%`;let s=stats();$("tradeDays").textContent=s.t.length;$("winRate").textContent=(s.t.length?s.w/s.t.length*100:0).toFixed(1)+"%";$("streak").textContent=s.s;$("peak").textContent=money(s.peak);$("mdd").textContent=s.mdd.toFixed(1)+"%";$("tier").textContent=tier();let exp=state.records.length*20+s.w*10,lv=Math.floor(exp/100)+1;$("levelNum").textContent="Lv."+lv;$("levelTitle").textContent=lv>=20?"Master Trader":lv>=10?"Pro Trader":lv>=5?"Skilled Trader":"Rookie Trader";$("expText").textContent=`EXP ${exp%100} / 100`;$("expBar").style.width=(exp%100)+"%";renderChart();renderHistory();renderAch();renderCal();renderMonthly();["Initial","Total","Fund","Ratio","Goal"].forEach((x,i)=>$("set"+x).value=[state.initialAsset,state.totalAsset,state.activeFund,state.ratio,state.goal][i])}
function renderChart(){let vals=[state.initialAsset,...state.records.map(r=>r.totalAfter)],svg=$("assetChart");svg.innerHTML="";if(!vals.length)return;let W=640,H=180,p=18,min=Math.min(...vals),max=Math.max(...vals),range=Math.max(max-min,1),pts=vals.map((v,i)=>[p+(W-2*p)*(vals.length===1?.5:i/(vals.length-1)),H-p-(H-2*p)*(v-min)/range]),ns="http://www.w3.org/2000/svg",line=document.createElementNS(ns,"polyline");line.setAttribute("fill","none");line.setAttribute("stroke","#34d399");line.setAttribute("stroke-width","4");line.setAttribute("points",pts.map(x=>x.join(",")).join(" "));svg.appendChild(line);$("chartCaption").textContent=`시작 ${money(state.initialAsset)} → 현재 ${money(state.totalAsset)}`}
function renderHistory(){let h=$("history");h.innerHTML="";[...state.records].reverse().forEach(r=>{let c=r.startFund?((r.endFund/r.startFund)-1)*100:0,e=document.createElement("div");e.className="entry";e.innerHTML=`<div class="entryTop"><b>${r.date}</b><b class="${r.type==="liquidation"||c<0?"loss":"win"}">${r.type==="skip"?"쉼":r.type==="liquidation"?"청산":(c>=0?"+":"")+c.toFixed(1)+"%"}</b></div><div class="muted">${r.type==="skip"?"거래 없음":money(r.startFund)+" → "+money(r.endFund)+" · 총자산 "+money(r.totalAfter)}</div>`;h.appendChild(e)});if(!state.records.length)h.innerHTML='<div class="muted">아직 기록 없음</div>'}
function renderAch(){let s=stats(),a=[["🎬","첫 기록",state.records.length>=1],["✅","첫 승",s.w>=1],["🔥","5연승",s.s>=5],["⚡","10연승",s.s>=10],["💰","$100",state.totalAsset>=100],["💎","$1,000",state.totalAsset>=1000],["🚀","최종 목표",state.totalAsset>=state.goal]];$("achievements").innerHTML="";a.forEach(x=>{let e=document.createElement("div");e.className="achievement"+(x[2]?"":" locked");e.innerHTML=`<div style="font-size:25px">${x[0]}</div><b>${x[1]}</b>`;$("achievements").appendChild(e)})}
function renderCal(){let y=cal.getFullYear(),m=cal.getMonth();$("calendarTitle").textContent=`${y}년 ${m+1}월`;$("calendar").innerHTML="";["일","월","화","수","목","금","토"].forEach(x=>{let e=document.createElement("div");e.className="dow";e.textContent=x;$("calendar").appendChild(e)});for(let i=0;i<new Date(y,m,1).getDay();i++)$("calendar").appendChild(document.createElement("div"));for(let day=1;day<=new Date(y,m+1,0).getDate();day++){let iso=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`,r=state.records.find(x=>x.date===iso),e=document.createElement("div");e.className="day";e.textContent=day;if(iso===today())e.classList.add("today");if(r)e.classList.add(r.type==="skip"?"skipDay":r.type==="liquidation"||r.endFund<r.startFund?"lossDay":"winDay");$("calendar").appendChild(e)}}
function renderMonthly(){let map={};state.records.forEach(r=>{let k=r.date.slice(0,7);if(!map[k])map[k]={s:r.totalBefore,e:r.totalAfter};else map[k].e=r.totalAfter});$("monthlyStats").innerHTML="";Object.keys(map).sort().reverse().forEach(k=>{let v=map[k],p=v.s?((v.e/v.s)-1)*100:0,e=document.createElement("div");e.className="monthRow";e.innerHTML=`<span>${k}</span><b class="${p>=0?"win":"loss"}">${p>=0?"+":""}${p.toFixed(2)}%</b>`;$("monthlyStats").appendChild(e)})}
$("saveTrade").onclick=()=>{let end=Number($("endFund").value);if(!Number.isFinite(end)||end<0)return;let start=state.activeFund,before=state.totalAsset;state.totalAsset+=end-start;state.activeFund=end;state.records.push({date:today(),type:"trade",startFund:start,endFund:end,totalBefore:before,totalAfter:state.totalAsset,note:$("note").value});save();if(navigator.vibrate)navigator.vibrate(40);render()};
$("skipTrade").onclick=()=>{state.records.push({date:today(),type:"skip",startFund:state.activeFund,endFund:state.activeFund,totalBefore:state.totalAsset,totalAfter:state.totalAsset});save();render()};
$("liquidation").onclick=()=>{if(!confirm("청산 기록?"))return;let before=state.totalAsset,start=state.activeFund;state.totalAsset-=start;state.activeFund=state.totalAsset*(state.ratio/100);state.records.push({date:today(),type:"liquidation",startFund:start,endFund:0,totalBefore:before,totalAfter:state.totalAsset});save();render()};
$("editToday").onclick=()=>{let i=state.records.findIndex(r=>r.date===today());if(i<0)return;let r=state.records[i];state.totalAsset=r.totalBefore;state.activeFund=r.startFund;state.records.splice(i,1);save();render()};
$("saveSettings").onclick=()=>{state.initialAsset=Number($("setInitial").value);state.totalAsset=Number($("setTotal").value);state.activeFund=Number($("setFund").value);state.ratio=Number($("setRatio").value);state.goal=Number($("setGoal").value);save();render()};
$("exportData").onclick=()=>{let b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="trading-rpg-backup.json";a.click()};
$("importData").onclick=()=>$("importFile").click();$("importFile").onchange=async e=>{let f=e.target.files[0];if(f){state=JSON.parse(await f.text());save();render()}};
$("resetAll").onclick=()=>{if(confirm("전체 초기화?")){localStorage.removeItem(KEY);location.reload()}};
document.querySelectorAll(".navBtn").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".navBtn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");document.querySelectorAll(".tabPage").forEach(p=>p.classList.remove("active"));$("tab-"+btn.dataset.tab).classList.add("active");window.scrollTo(0,0)});
$("prevMonth").onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()-1,1);renderCal()};$("nextMonth").onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()+1,1);renderCal()};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("installBtn").classList.remove("hidden")});$("installBtn").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$("installBtn").classList.add("hidden")}};
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
window.addEventListener("load",()=>setTimeout(()=>{let s=$("splash");s.style.opacity=0;setTimeout(()=>s.remove(),350)},700));render();
</script></body></html>
